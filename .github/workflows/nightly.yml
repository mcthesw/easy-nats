name: Nightly Build

on:
  schedule:
    - cron: "0 2 * * *" # 2:00 AM UTC daily
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  package:
    name: Nightly ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows
            packager: false
            bin: easy-nats.exe
            portable_name: easy-nats-nightly-windows-x86_64.zip
          - target: x86_64-apple-darwin
            os: macos-13
            platform: macos
            packager: true
            formats: dmg
            bin: easy-nats
            portable_name: easy-nats-nightly-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos
            packager: true
            formats: dmg
            bin: easy-nats
            portable_name: easy-nats-nightly-macos-aarch64.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux
            packager: true
            formats: deb appimage
            bin: easy-nats
            portable_name: easy-nats-nightly-linux-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install cargo-packager
        if: matrix.packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p easy-nats

      - name: Create portable archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" `
            -DestinationPath "dist/${{ matrix.portable_name }}"

      - name: Create portable archive (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p dist
          tar czf "dist/${{ matrix.portable_name }}" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"

      - name: Run cargo-packager
        if: matrix.packager
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo packager \
            --release \
            --manifest-path crates/app/Cargo.toml \
            --target ${{ matrix.target }} \
            --out-dir dist \
            --formats ${{ matrix.formats }}

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easy-nats-nightly-${{ matrix.target }}
          path: dist/**/*
          if-no-files-found: error
          retention-days: 14

  rpm:
    name: Nightly RPM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-rpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install cargo-generate-rpm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release -p easy-nats

      - name: Strip binary
        run: strip target/release/easy-nats

      - name: Generate RPM
        run: cargo generate-rpm -p crates/app

      - name: Upload nightly RPM
        uses: actions/upload-artifact@v4
        with:
          name: easy-nats-nightly-rpm-x86_64
          path: target/generate-rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
