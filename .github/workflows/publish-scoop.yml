name: Publish Scoop

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0, without leading 'v')"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          echo "version=${{ inputs.version }}" >>"${GITHUB_OUTPUT}"
          echo "tag=v${{ inputs.version }}" >>"${GITHUB_OUTPUT}"

      - name: Download release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern manifest.json --dir release-meta

      - name: Render manifest
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          win_sha=$(jq -r '.assets[] | select(.name == "easy-nats-windows-x86_64.zip") | .sha256' release-meta/manifest.json)
          test -n "${win_sha}" && test "${win_sha}" != "null"
          mkdir -p out
          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@SHA_X86_64@|${win_sha}|g" \
              packaging/scoop/easy-nats.json.tmpl > out/easy-nats.json

      - name: Checkout bucket
        uses: actions/checkout@v4
        with:
          repository: mcthesw/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket-repo

      - name: Commit manifest
        working-directory: bucket-repo
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p bucket
          cp ../out/easy-nats.json bucket/easy-nats.json
          git config user.name "easy-nats-release-bot"
          git config user.email "actions@github.com"
          git add bucket/easy-nats.json
          if git diff --cached --quiet; then
            echo "No Scoop changes"
            exit 0
          fi
          git commit -m "easy-nats ${VERSION}"
          git push
