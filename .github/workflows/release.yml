name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild (e.g. v0.2.0). Required for manual runs."
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  setup:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -z "${tag}" ]]; then
            echo "No tag resolved" >&2
            exit 1
          fi
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "ref=refs/tags/${tag}" >>"${GITHUB_OUTPUT}"

  package:
    name: Package ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows
            packager: false
            bin: easy-nats.exe
            portable_name: easy-nats-windows-x86_64.zip
          - target: x86_64-apple-darwin
            os: macos-13
            platform: macos
            packager: true
            formats: dmg
            bin: easy-nats
            portable_name: easy-nats-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos
            packager: true
            formats: dmg
            bin: easy-nats
            portable_name: easy-nats-macos-aarch64.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux
            packager: true
            formats: deb appimage
            bin: easy-nats
            portable_name: easy-nats-linux-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install cargo-packager
        if: matrix.packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p easy-nats

      - name: Create portable archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" `
            -DestinationPath "dist/${{ matrix.portable_name }}"

      - name: Create portable archive (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p dist
          tar czf "dist/${{ matrix.portable_name }}" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"

      - name: Detect Apple signing secrets
        id: apple_secrets
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "${APPLE_CERTIFICATE}" && -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            echo "sign=true" >>"${GITHUB_OUTPUT}"
          else
            echo "sign=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos' && steps.apple_secrets.outputs.sign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${APPLE_CERTIFICATE}" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" build.keychain
          rm -f /tmp/cert.p12

      - name: Run cargo-packager
        if: matrix.packager
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.apple_secrets.outputs.sign == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p dist
          extra=()
          if [[ "${{ matrix.platform }}" == "macos" && -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            extra+=(--config "{\"macos\":{\"signing-identity\":\"${APPLE_SIGNING_IDENTITY}\"}}")
          fi
          cargo packager \
            --release \
            --manifest-path crates/app/Cargo.toml \
            --target ${{ matrix.target }} \
            --out-dir dist \
            --formats ${{ matrix.formats }} \
            "${extra[@]}"

      - name: List dist directory
        shell: bash
        run: |
          ls -R dist || true

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            dist/**/*
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: Package RPM
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-rpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install cargo-generate-rpm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release -p easy-nats

      - name: Strip binary
        run: strip target/release/easy-nats

      - name: Generate RPM
        run: cargo generate-rpm -p crates/app

      - name: Stage RPM output
        run: |
          mkdir -p dist
          cp target/generate-rpm/*.rpm dist/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-rpm-x86_64
          path: dist/**/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release
    needs: [setup, package, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: packages-*
          merge-multiple: false

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find staging -type f \( \
            -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o \
            -name '*.AppImage' -o -name '*.zip' -o -name '*.tar.gz' \
          \) -exec cp -v {} release-assets/ \;
          ls -la release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          : > SHA256SUMS
          for f in $(ls -1 | grep -v '^SHA256SUMS$' | sort); do
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Generate manifest.json
        env:
          TAG: ${{ needs.setup.outputs.tag }}
          REPO: ${{ github.repository }}
        working-directory: release-assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          assets = []
          for p in sorted(pathlib.Path('.').iterdir()):
              if not p.is_file() or p.name in ("manifest.json",):
                  continue
              if p.name == "SHA256SUMS":
                  sha = hashlib.sha256(p.read_bytes()).hexdigest()
              else:
                  sha = hashlib.sha256(p.read_bytes()).hexdigest()
              assets.append({
                  "name": p.name,
                  "size": p.stat().st_size,
                  "sha256": sha,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{p.name}",
              })
          manifest = {"tag": tag, "repository": repo, "assets": assets}
          pathlib.Path("manifest.json").write_text(json.dumps(manifest, indent=2))
          print(pathlib.Path("manifest.json").read_text())
          PY

      - name: Verify release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${TAG} found"
              exit 0
            fi
            echo "Release ${TAG} not yet available (attempt ${attempt}); retrying..."
            sleep 15
          done
          echo "Release ${TAG} was not created by release-please; refusing to create one here." >&2
          exit 1

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          files: release-assets/*
          fail_on_unmatched_files: true

  validate:
    name: Validate release assets
    needs: [setup, assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir verify
          ls -la verify

      - name: Verify manifest and checksums
        working-directory: verify
        run: |
          set -euo pipefail
          test -f manifest.json
          test -f SHA256SUMS
          echo "--- manifest asset coverage ---"
          jq -r '.assets[].name' manifest.json | while read -r n; do
            test -f "${n}" || { echo "missing asset: ${n}" >&2; exit 1; }
          done
          echo "--- checksum verification ---"
          sha256sum -c SHA256SUMS
          echo "--- expected platforms ---"
          for pat in \
            'easy-nats-windows-x86_64.zip' \
            'easy-nats-macos-x86_64.tar.gz' \
            'easy-nats-macos-aarch64.tar.gz' \
            'easy-nats-linux-x86_64.tar.gz' \
            '.*\.deb$' \
            '.*\.rpm$' \
            '.*\.AppImage$' \
            '.*\.dmg$'; do
            if ! jq -er --arg p "${pat}" '.assets[] | select(.name | test($p))' manifest.json >/dev/null; then
              echo "manifest.json missing required asset matching ${pat}" >&2
              exit 1
            fi
          done
          echo "All release assets validated."
