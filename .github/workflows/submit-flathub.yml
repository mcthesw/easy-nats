name: Submit Flathub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to submit (e.g. 0.2.0, without the leading 'v')"
        required: true
        type: string

permissions:
  contents: read

env:
  APP_ID: io.github.mcthesw.easy-nats
  UPSTREAM_REPO: flathub/flathub
  UPSTREAM_BRANCH: new-pr
  FORK_REPO: ${{ vars.FLATHUB_FORK }}

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate fork configuration
        run: |
          set -euo pipefail
          test -n "${FORK_REPO}"

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ inputs.version }}"
          echo "version=${ver}" >>"${GITHUB_OUTPUT}"
          echo "tag=v${ver}" >>"${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - name: Install Flatpak source generator
        run: |
          python3 -m pip install --user flatpak-cargo-generator
          echo "${HOME}/.local/bin" >>"${GITHUB_PATH}"

      - name: Render Flathub files
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          source_url="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          curl -L "${source_url}" -o out/source.tar.gz
          source_sha=$(sha256sum out/source.tar.gz | awk '{print $1}')
          flatpak-cargo-generator Cargo.lock -o out/cargo-sources.json
          sed -e "s|@REPO@|${REPO}|g" \
              -e "s|@TAG@|${TAG}|g" \
              -e "s|@SOURCE_SHA256@|${source_sha}|g" \
              packaging/flatpak/io.github.mcthesw.easy-nats.yml.tmpl > "out/${APP_ID}.yml"
          cp packaging/flatpak/io.github.mcthesw.easy-nats.desktop "out/${APP_ID}.desktop"
          cp packaging/flatpak/io.github.mcthesw.easy-nats.metainfo.xml "out/${APP_ID}.metainfo.xml"
          cp packaging/flatpak/flathub.json out/flathub.json
          cp packaging/icon.png "out/${APP_ID}.png"
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --mirror-screenshots-url=https://dl.flathub.org/media \
            out/build-tmp "out/${APP_ID}.yml"
          rm -rf out/build-tmp
          rm -f out/source.tar.gz

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          token: ${{ secrets.UPSTREAM_PR_TOKEN }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          path: fork
          fetch-depth: 0

      - name: Commit Flathub submission
        working-directory: fork
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          branch="${APP_ID}-${VERSION}"
          git checkout -B "${branch}" "origin/${UPSTREAM_BRANCH}"
          cp "../out/${APP_ID}.yml" "${APP_ID}.yml"
          cp "../out/${APP_ID}.desktop" "${APP_ID}.desktop"
          cp "../out/${APP_ID}.metainfo.xml" "${APP_ID}.metainfo.xml"
          cp "../out/${APP_ID}.png" "${APP_ID}.png"
          cp ../out/cargo-sources.json cargo-sources.json
          cp ../out/flathub.json flathub.json
          git config user.name "easy-nats-release-bot"
          git config user.email "actions@github.com"
          git add "${APP_ID}.yml" "${APP_ID}.desktop" "${APP_ID}.metainfo.xml" "${APP_ID}.png" cargo-sources.json flathub.json
          if git diff --cached --quiet; then
            echo "No Flathub changes"
            exit 0
          fi
          git commit -m "Add ${APP_ID} ${VERSION}"
          git push --force-with-lease origin "${branch}"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          branch="${APP_ID}-${VERSION}"
          fork_owner="${FORK_REPO%%/*}"
          existing=$(gh pr list --repo "${UPSTREAM_REPO}" --state open --head "${fork_owner}:${branch}" --json number --jq '.[0].number // empty')
          if [[ -n "${existing}" ]]; then
            echo "Flathub PR already open: #${existing}"
            exit 0
          fi
          gh pr create \
            --repo "${UPSTREAM_REPO}" \
            --base "${UPSTREAM_BRANCH}" \
            --head "${fork_owner}:${branch}" \
            --title "Add ${APP_ID}" \
            --body "Initial Flathub submission for easy-nats ${VERSION}. Future updates are handled by Flathub's external-data-checker."
