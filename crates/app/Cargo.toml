[package]
name = "easy-nats"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nats-backend = { path = "../nats-backend" }
base64 = "0.22"
dirs = "6"
eframe = "0.34.1"
egui_dock = "0.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
