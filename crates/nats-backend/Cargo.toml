[package]
name = "nats-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-nats = { version = "0.47", features = ["nkeys", "jetstream", "kv", "object-store"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
scc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio-util = "0.7"
