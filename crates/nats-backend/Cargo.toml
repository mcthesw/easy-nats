[package]
name = "nats-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-nats = { version = "0.47.0", features = ["nkeys", "jetstream"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
scc = "3.6.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
